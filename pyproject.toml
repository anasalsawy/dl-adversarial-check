[project]
name = "dl-adversarial-check"
version = "0.1.0"
description = "B-lobe hunts deception via tool-driven adversarial checks & counter-evidence compilation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "structlog>=24,<25",
    "dl-tools-lib @ git+https://github.com/anasalsawy/dl-tools-lib.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_adversarial_check"]
